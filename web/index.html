<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PosterWall</title>
    <meta
      name="description"
      content="A wall of movie posters: English, UK, Hindi, Telugu and Tamil films, rated and discussed."
    />
    <meta name="theme-color" content="#1E1B4B" />
    <!-- dark class before first paint, so a dark-mode visit doesn't flash white (next-themes takes over after) -->
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
